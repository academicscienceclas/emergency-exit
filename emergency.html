<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Shut-Off</title>
</head>
<body>
    <button onclick="emergencyShutOff()">Emergency Shut-Off</button>

    <script>
        function emergencyShutOff() {
            // Redirect to a neutral page for safety
            window.location.href = "https://www.google.com"; // Change this to a safe page URL
        }
    </script>
</body>
</html>
